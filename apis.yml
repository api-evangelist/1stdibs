name: 1stdibs
description: >-
  1stDibs is an online marketplace for luxury antiques, vintage and modern furniture,
  fine art, jewelry, watches, and fashion. It connects a global network of vetted
  sellers and design dealers with buyers seeking curated, authenticated high-end
  goods, backed by purchase-protection and authenticity guarantees. 1stDibs does
  not operate a public REST/OpenAPI developer program; its documented machine-facing
  surface is an official Model Context Protocol (MCP) server, registered as
  com.1stdibs/1stDibs, that lets agents browse and search the marketplace.
